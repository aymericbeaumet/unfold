<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>World Map</title>
    <link rel="shortcut icon" href="./static/assets/favicon.png" />

    <!-- Preload the first-paint font so the loading title renders in IM Fell
         immediately, not in a fallback. Data files (background.pmtiles,
         cities.bin) are fetched from main.js as soon as its module body runs
         — preloading them from HTML doesn't help here because Parcel's HTML
         and JS asset pipelines emit different hashed copies, which would just
         double-download. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="./static/fonts/im-fell-english-400.woff2"
      crossorigin
    />

    <style>
      /* IM Fell English (SIL OFL, public domain heritage) — drawn from the
         1670s type cuts of John Fell. The 400-normal weight is declared here
         (not via @fontsource) so the browser can preload it from index.html
         and the first-paint title font doesn't wait on main.js to parse. */
      @font-face {
        font-family: "IM Fell English";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("./static/fonts/im-fell-english-400.woff2") format("woff2");
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f0dec2;
        overflow: hidden;
        font-family: "IM Fell English", "Palatino", "Georgia", serif;
      }

      body,
      #overlay,
      #context-menu {
        cursor: url("./static/assets/default.cur"), default;
      }

      body.cursor-move,
      button,
      a,
      .search-result {
        cursor: url("./static/assets/move.cur"), default;
      }

      #map {
        position: absolute;
        inset: 0;
      }

      /* ── adventure-map aesthetic ─────────────────────────────────────── */

      /* Procedural parchment grain that multiplies into the map colours. */
      #paper {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 10;
        mix-blend-mode: multiply;
        opacity: 0.45;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.1' numOctaves='2' seed='8'/><feColorMatrix values='0 0 0 0 0.45  0 0 0 0 0.32  0 0 0 0 0.15  0 0 0 0.85 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
        background-size: 600px 600px;
      }

      /* Laid-paper "wire lines": faint vertical lines from the papermaker's
         mould, visible when the parchment is backlit. */
      #wire-lines {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 10;
        mix-blend-mode: multiply;
        opacity: 0.35;
        background-image: repeating-linear-gradient(
          90deg,
          transparent 0,
          transparent 13px,
          rgba(70, 45, 20, 0.05) 13px,
          rgba(70, 45, 20, 0.05) 14px
        );
      }

      /* Soft brown vignette around the edges. */
      #vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 11;
        background: radial-gradient(
          ellipse at center,
          transparent 55%,
          rgba(90, 55, 20, 0.35) 100%
        );
      }

      /* Warm sun-spot in the upper right corner. */
      #sun {
        position: absolute;
        top: -120px;
        right: -120px;
        width: 380px;
        height: 380px;
        border-radius: 50%;
        pointer-events: none;
        z-index: 12;
        background: radial-gradient(
          circle,
          rgba(255, 230, 160, 0.55) 0%,
          rgba(255, 200, 120, 0.18) 45%,
          transparent 70%
        );
      }

      /* The plate-mark depression: where the copper plate pressed the damp
         rag paper. A thin engraved frame just outside the map area. */
      #plate-mark {
        position: absolute;
        inset: 22px;
        pointer-events: none;
        z-index: 14;
        border: 1px solid rgba(60, 40, 15, 0.55);
        box-shadow:
          inset 0 0 0 1px rgba(245, 222, 184, 0.3),
          inset 0 0 8px rgba(70, 45, 20, 0.28),
          0 0 1px rgba(70, 45, 20, 0.5);
      }

      /* ── context menu ────────────────────────────────────────────────── */

      #context-menu {
        position: fixed;
        z-index: 60;
        width: 170px;
        background: #1b1a1a;
        border-radius: 5px;
        display: none;
        font-family: "Palatino", "Georgia", serif;
      }
      #context-menu.visible {
        display: block;
      }
      #context-menu .item {
        padding: 8px 10px;
        font-size: 15px;
        color: #eee;
        cursor: pointer;
        border-radius: inherit;
      }
      #context-menu .item:hover {
        background: #343434;
      }

      /* ── search palette (cmd/ctrl+K) ─────────────────────────────────── */

      #search-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(40, 25, 10, 0.35);
        z-index: 80;
        display: none;
      }
      #search-backdrop.visible {
        display: block;
      }

      #search {
        position: fixed;
        top: 12vh;
        left: 50%;
        transform: translateX(-50%);
        width: min(520px, 92vw);
        background: #f6e6c8;
        border: 1px solid #8a6a3a;
        border-radius: 6px;
        box-shadow:
          0 10px 30px rgba(0, 0, 0, 0.35),
          inset 0 0 60px rgba(170, 130, 70, 0.18);
        z-index: 81;
        display: none;
        overflow: hidden;
      }
      #search.visible {
        display: block;
      }
      #search-input {
        width: 100%;
        box-sizing: border-box;
        padding: 14px 18px;
        font: 18px "IM Fell English", "Palatino", serif;
        background: transparent;
        border: 0;
        border-bottom: 1px solid #b58e54;
        color: #2b1a0a;
        outline: none;
      }
      #search-input::placeholder {
        color: #8a6a3a;
        opacity: 0.7;
      }
      #search-results {
        max-height: 50vh;
        overflow-y: auto;
      }
      .search-result {
        padding: 9px 18px;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
        color: #2b1a0a;
        border-bottom: 1px dashed rgba(138, 106, 58, 0.35);
      }
      .search-result:last-child {
        border-bottom: 0;
      }
      .search-result.active {
        background: rgba(170, 130, 70, 0.25);
      }
      .search-result .name {
        font: 17px "IM Fell English", "Palatino", serif;
      }
      .search-result .meta {
        font: 12px "Palatino", "Georgia", serif;
        color: #6a4a20;
        opacity: 0.85;
        white-space: nowrap;
      }
      .search-empty {
        padding: 18px;
        color: #8a6a3a;
        font: 14px "Palatino", "Georgia", serif;
        font-style: italic;
      }

      /* ── loading overlay ─────────────────────────────────────────────── */

      #loading {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f0dec2;
        transition: opacity 600ms ease-out;
      }
      #loading.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #loading-card {
        text-align: center;
        color: #2b1a0a;
      }
      #loading-card .title {
        font: 30px "IM Fell English", "Palatino", serif;
        letter-spacing: 0.08em;
        margin-bottom: 18px;
      }
      #loading-bar {
        width: 280px;
        height: 4px;
        background: rgba(43, 26, 10, 0.18);
        border-radius: 2px;
        overflow: hidden;
        margin: 0 auto;
      }
      #loading-bar-fill {
        height: 100%;
        width: 0%;
        background: #2b1a0a;
        transition: width 200ms ease-out;
      }
      #loading-status {
        margin-top: 12px;
        font: 13px "Palatino", "Georgia", serif;
        font-style: italic;
        color: #6a4a20;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <div id="paper"></div>
    <div id="wire-lines"></div>

    <div id="vignette"></div>
    <div id="sun"></div>
    <div id="plate-mark"></div>

    <div id="context-menu">
      <div class="item" data-action="coordinates"></div>
      <div class="item" data-action="googlemaps">Google Maps</div>
      <div class="item" data-action="fullscreen">Fullscreen</div>
    </div>

    <div id="search-backdrop"></div>
    <div id="search" role="dialog" aria-label="Search cities">
      <input
        id="search-input"
        type="text"
        autocomplete="off"
        spellcheck="false"
        placeholder="Search a city  (e.g. Paris, or Cairo Egypt)"
      />
      <div id="search-results"></div>
    </div>

    <div id="loading">
      <div id="loading-card">
        <div class="title">Aperitur Tabula Mundi</div>
        <div id="loading-bar"><div id="loading-bar-fill"></div></div>
        <div id="loading-status">cartographi vocantur</div>
      </div>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
