<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>World Map</title>
    <link rel="stylesheet" href="https://openlayers.org/en/latest/css/ol.css" type="text/css">
    <style>
      html, body {
        margin: 0;
        height: 100%;
        cursor: url("./static/assets/cursor.cur"), default;
      }

      #map {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 100%;
        background-color: lightyellow;
      }

      #context-menu {
        position: fixed;
        z-index: 10000;
        width: 150px;
        background: #1b1a1a;
        border-radius: 5px;
        opacity: 0;
      }

      #context-menu.visible {
        opacity: 1;
      }

      #context-menu .item {
        padding: 8px 10px;
        font-size: 15px;
        color: #eee;
        cursor: pointer;
        border-radius: inherit;
      }

      #context-menu .item:hover {
        background: #343434;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <div id="context-menu">
      <div class="item" data-action="fullscreen">Fullscreen</div>
      <div class="item" data-action="sourcecode">Source Code</div>
    </div>

    <script src="./main.js"></script>
  </body>
</html>
