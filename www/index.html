<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>World Map</title>
    <link rel="stylesheet" href="https://openlayers.org/en/latest/css/ol.css" type="text/css">
    <style>
      @font-face {
        font-family: 'Luminari';
        font-style: normal;
        font-weight: normal;
        src: local('Luminari'), url('./static/assets/Luminari-Regular.woff') format('woff');
      }

      html, body {
        margin: 0;
        height: 100%;
      }

      body, #overlay, #context-menu {
        cursor: url("./static/assets/cursor.cur"), default;
      }

      body.hand, button, a {
        cursor: url("./static/assets/hand.cur"), default;
      }

      #map {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 100%;
      }

      #overlay {
        position: absolute;
        top:0;
        right:0;
        height: 100%;
        width: 30%;
        background-color: red;
        display: none;
      }

      #overlay.visible {
        display: block
      }

      #context-menu {
        position: fixed;
        z-index: 10000;
        width: 150px;
        background: #1b1a1a;
        border-radius: 5px;
        display: none;
      }

      #context-menu.visible {
        display: block;
      }

      #context-menu .item {
        padding: 8px 10px;
        font-size: 15px;
        color: #eee;
        cursor: pointer;
        border-radius: inherit;
      }

      #context-menu .item:hover {
        background: #343434;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <div id="overlay">
      <button data-action="close">X</button>
      <div></div>
    </div>

    <div id="context-menu">
      <div class="item" data-action="coordinates"></div>
      <div class="item" data-action="googlemaps">Google Maps</div>
      <div class="item" data-action="fullscreen">Fullscreen</div>
      <div class="item" data-action="sourcecode">Source Code</div>
    </div>

    <script src="./main.js"></script>
  </body>
</html>
